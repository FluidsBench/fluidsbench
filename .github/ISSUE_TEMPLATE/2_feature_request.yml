name: 🚀 Feature request
description: Propose a feature for this project
labels: ["needs triage", "enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        Use this template for a proposed website or leaderboard-interface improvement.
        Proposals for dataset contracts, scoring support, validators, or result packages belong in
        [fluidsbench-submission](https://github.com/neilashton/fluidsbench-submission/issues).

  - type: checkboxes
    id: requirements
    attributes:
      label: Have you checked that your feature request isn't already filed?
      description: >
        Please check if somebody else has already filed the same 🚀 feature request.
        If you find a similar feature request, please add a 👍 reaction or comment on the original post.
      options:
        - label: I read the [FluidsBench repository overview](https://github.com/neilashton/fluidsbench#readme).
          required: true
        - label: I searched the [existing FluidsBench issues](https://github.com/neilashton/fluidsbench/issues) and did not find the same proposal.
          required: true

  - type: textarea
    attributes:
      label: Description and motivation
      description: Describe the proposal and the problem it would solve.
      placeholder: |
        Please outline the motivation for the proposal.
        Is your feature request related to a problem? e.g., I'm always frustrated when [...].
        If this relates to another GitHub issue, link it here.

  - type: textarea
    attributes:
      label: Pitch
      description: A clear and concise description of what you want to happen.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Alternatives
      description: A clear and concise description of any alternative solutions or features you've considered, if any.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
