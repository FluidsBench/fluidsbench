name: Profile data contract

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fluidsbench
      - uses: actions/checkout@v4
        with:
          repository: neilashton/fluidsbench-submission
          # SI-only snapshot of the existing preview contracts.
          # Publish the paired submission history before the website.
          ref: b4c04d6131c81578eca4e7ef8bee53ebb9f69ec3
          path: fluidsbench-submission
      - uses: actions/checkout@v4
        with:
          repository: neilashton/fluidsbench-submission
          # Public schemas and the canonical source audit from current dev.
          # The feed above retains existing non-HiLift dataset contracts.
          ref: 73c80037bbc96bb43043277b7121815802349d6b
          sparse-checkout: |
            schemas
            docs
          path: fluidsbench-submission-schemas
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fluidsbench/bin/check_dataset_pages.py --submission-root fluidsbench-submission
      - run: python fluidsbench/bin/check_pressure_references.py --submission-root fluidsbench-submission-schemas
      - run: python fluidsbench/bin/check_profile_contract.py --submission-root fluidsbench-submission --schema-root fluidsbench-submission-schemas
      - run: python fluidsbench/bin/prepare_submission_status.py --submission-root fluidsbench-submission --check
      - run: ruby fluidsbench/bin/check_launch_contract.rb
      - run: node --test fluidsbench/tests/test_launch.js fluidsbench/tests/test_leaderboard_compute.js fluidsbench/tests/test_leaderboard_scores.js fluidsbench/tests/test_leaderboard_verification.js
      - run: node fluidsbench/bin/check_leaderboard_claim_ui.js
      - run: python -m unittest discover -s fluidsbench/tests -p "test_*.py"
